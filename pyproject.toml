[project]
name = "dartweave"
version = "0.1.0"
description = "DART 공시 이중 출처 신뢰 그래프"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "neo4j>=5.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "networkx>=3.6.1",
    "pytest>=8.0",
    "python-igraph>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dartweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
